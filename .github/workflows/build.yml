name: Build C++ EXE

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MinGW
        run: |
          choco install mingw -y

      - name: Build EXE
        run: |
          g++ leona.cpp -std=c++17 -O2 -o main.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: main.exe
