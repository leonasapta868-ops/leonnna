name: Build C++ EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MinGW
        run: |
          choco install mingw -y

      - name: Build EXE
        run: |
          g++ leona.cpp -std=c++17 -O2 -static -static-libgcc -static-libstdc++ -o main.exe

      - name: Check EXE
        run: |
          dir main.exe

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE
          path: main.exe
